<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			(() => {
				const THEME_STORAGE_KEY = 'mtrek-theme';

				try {
					const theme = localStorage.getItem(THEME_STORAGE_KEY);
					const prefersDark = matchMedia(
						'(prefers-color-scheme: dark)'
					).matches;

					if (theme === 'light' || theme === 'dark') {
						document.documentElement.dataset.theme = theme;
					}

					document.documentElement.classList.toggle(
						'dark',
						theme === 'dark' || (theme !== 'light' && prefersDark)
					);
				} catch {
					// The system preference remains active when storage is unavailable.
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div class="svelte-root">%sveltekit.body%</div>
	</body>
</html>
